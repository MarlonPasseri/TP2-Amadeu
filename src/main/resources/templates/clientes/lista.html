<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
<h1 class="mb-3">Clientes</h1>

<a href="/clientes/novo" class="btn btn-primary mb-3" id="btnNovoCliente">Novo Cliente</a>

<div th:if="${mensagemSucesso}" class="alert alert-success" role="alert" id="msgSucesso">
    <span th:text="${mensagemSucesso}"></span>
</div>

<table class="table table-striped table-responsive" id="tabelaClientes">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cliente : ${clientes}">
        <td th:text="${cliente.id}">1</td>
        <td th:text="${cliente.nome}">Nome</td>
        <td th:text="${cliente.email}">email@example.com</td>
        <td>
            <a th:href="@{'/clientes/' + ${cliente.id} + '/editar'}"
               class="btn btn-sm btn-warning btnEditar">Editar</a>
            <form th:action="@{'/clientes/' + ${cliente.id} + '/excluir'}"
                  method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-danger btnExcluir"
                        onclick="return confirm('Deseja realmente excluir?');">
                    Excluir
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
