<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

<h1 th:text="${cliente.id} != null ? 'Editar Cliente' : 'Novo Cliente'">Cliente</h1>

<form th:action="${cliente.id} != null ? @{'/clientes/' + ${cliente.id}} : @{/clientes}"
      th:object="${cliente}"
      method="post"
      class="mt-3">

    <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input id="nome" type="text" th:field="*{nome}" class="form-control"
               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}"
             th:errors="*{nome}">Nome inválido</div>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input id="email" type="text" th:field="*{email}" class="form-control"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">Email inválido</div>
    </div>

    <button type="submit" class="btn btn-success" id="btnSalvar">Salvar</button>
    <a href="/clientes" class="btn btn-secondary">Cancelar</a>
</form>

</body>
</html>
